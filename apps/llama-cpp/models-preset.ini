version = 1

# ══════════════════════════════════════════════════════════════════════
#  Deux modèles Qwen abliterated (uncensored), chargés à la demande.
#
#  qwen       — Qwen3.6-35B-A3B : MoE, 3B actifs, experts en RAM. Qualité.
#  qwen-fast  — Qwen3.5-4B      : 100 % GPU. Latence.
#
#  Cible : GTX 1660 SUPER 6 Go (5,4 Go libres) / Ryzen 7 5800X / 64 Go DDR4-3200
# ══════════════════════════════════════════════════════════════════════

[*]
n-gpu-layers   = 99
flash-attn     = auto
# KV en q8_0 : moitié moins de VRAM, perte négligeable
cache-type-k   = q8_0
cache-type-v   = q8_0
jinja          = true
# 8 threads = 8 cœurs physiques ; le SMT n'apporte rien en inference
threads        = 8
threads-batch  = 8
parallel       = 1
cont-batching  = true
# Réutilisation du préfixe commun (system prompt) d'une requête à l'autre :
# indispensable ici, le prefill est le vrai coût quand les experts sont en RAM
cache-reuse    = 256
slot-save-path = /slot-cache
metrics        = true

# ──────────────────────────────────────────────────────────────────────
# qwen — Huihui-Qwen3.6-35B-A3B-abliterated, Q4_K_S (19,9 Go)
#
# MoE 256 experts, 8 actifs par token → ~3B de paramètres actifs. Les experts
# vivent en RAM, le GPU ne garde que l'attention et le KV cache.
# Thinking laissé ACTIF : c'est ce qui justifie d'attendre ce modèle-là.
#
# ⚠️ À TESTER EN PREMIER. L'équipe OBLITERATUS documente que sur un modèle
# abliterated, le mode thinking peut faire RÉAPPARAÎTRE les refus : la chaîne de
# raisonnement re-dérive le refus par elle-même, alors que la direction de refus
# a été retirée des poids de génération. Si tu vois des refus sur [qwen],
# décommente la ligne ci-dessous avant de chercher plus loin.
# chat-template-kwargs = {"enable_thinking":false}
# ──────────────────────────────────────────────────────────────────────
[qwen]
model      = /models/qwen3.6-35b-a3b-abliterated/Huihui-Qwen3.6-35B-A3B-abliterated-Q4_K_S.gguf
# Archi hybride : 10 couches sur 40 seulement font de l'attention complète
# (kv 2 têtes × 256) → ~10 Ko de KV par token. 64k ne coûte que ~0,65 Go.
# Le modèle accepte 262144 en natif ; monter par paliers en surveillant nvidia-smi.
ctx-size    = 65536
# 99 = tous les experts en RAM. Baisser d'un cran remonte les experts d'une
# couche sur le GPU (~400 Mo) ; il reste ~1,5 Go de marge.
n-cpu-moe   = 99
batch-size  = 2048
ubatch-size = 512
# Le template du 3.6 n'expose pas reasoning_effort (c'est une nouveauté 3.8) :
# la chaîne de raisonnement n'est donc pas bornée côté modèle. À 15-25 tok/s,
# 1000 tokens de réflexion = ~1 minute avant que la réponse ne commence.
# Garde-fou natif llama.cpp si ça devient pénible (coupe la réflexion au budget
# indiqué au lieu de la laisser courir) :
# reasoning-budget = 512
# Échantillonnage officiel Qwen, mode thinking, tâches générales
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
presence-penalty = 1.5
repeat-penalty   = 1.0

# ──────────────────────────────────────────────────────────────────────
# qwen-fast — Huihui-Qwen3.5-4B-abliterated, Q5_K_M (3,1 Go)
#
# Entièrement en VRAM. Thinking COUPÉ : ce slot existe pour la latence,
# et un 4B qui réfléchit 800 tokens avant de répondre n'est plus rapide.
# ──────────────────────────────────────────────────────────────────────
[qwen-fast]
model      = /models/qwen3.5-4b-abliterated/Huihui-Qwen3.5-4B-abliterated.Q5_K_M.gguf
# 8 couches sur 32 en attention complète → ~16 Ko/token.
# 3,1 Go de poids + ~1,0 Go de KV à 64k + ~0,5 Go de buffers ≈ 4,6 / 5,4 Go.
ctx-size    = 65536
n-cpu-moe   = 0
batch-size  = 2048
ubatch-size = 512
# Le template Qwen3.5 expose enable_thinking
chat-template-kwargs = {"enable_thinking":false}
# Échantillonnage officiel Qwen, mode non-thinking
temp             = 0.7
top-p            = 0.8
top-k            = 20
min-p            = 0.0
presence-penalty = 1.5
repeat-penalty   = 1.0
